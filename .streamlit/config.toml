# Configuración de Streamlit para el Sistema de Catas
# Tema oscuro premium. El servidor local lo lanza arrancar_web.py con flags
# (bind a Tailscale); en Streamlit Community Cloud la plataforma lo gestiona.

[theme]
base = "dark"
primaryColor = "#4ADE80"          # verde neón (acciones/acentos)
backgroundColor = "#0E1116"       # fondo profundo
secondaryBackgroundColor = "#171C23"  # tarjetas
textColor = "#EAF0F6"             # texto principal
font = "sans serif"

[browser]
gatherUsageStats = false
